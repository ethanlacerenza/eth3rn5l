[package]
name    = "eth3rn5l-portfolio"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys       = "0.3"
web-sys      = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlHeadElement", "Node",
    "HtmlCanvasElement",
    "WebGl2RenderingContext", "WebGlBuffer", "WebGlProgram", "WebGlShader",
    "WebGlTexture", "WebGlFramebuffer", "WebGlUniformLocation",
    "MouseEvent", "EventTarget", "Performance", "console",
] }

[profile.release]
opt-level = "z"
lto       = true
codegen-units = 1
panic = "abort"
